buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net' }
        mavenCentral()
    }
    dependencies {
        classpath group: 'net.minecraftforge.gradle', name: 'ForgeGradle', version: '5.1.+', changing: true
    }
}
apply plugin: 'net.minecraftforge.gradle'
// Only edit below this line, the above code adds and enables the necessary things for Forge to be setup.
apply plugin: 'eclipse'
apply plugin: 'maven-publish'

// Load .env file if present (gitignored — store secrets like MODRINTH_TOKEN here)
def dotEnv = new Properties()
def dotEnvFile = file('.env')
if (!dotEnvFile.exists()) {
    // A git worktree has no .env of its own: use the main checkout's.
    def common = "git rev-parse --git-common-dir".execute(null, projectDir).text.trim()
    if (common) {
        def commonDir = new File(common)
        if (!commonDir.absolute) commonDir = new File(projectDir, common)
        dotEnvFile = new File(commonDir.canonicalFile.parentFile, '.env')
    }
}
if (dotEnvFile.exists()) {
    dotEnvFile.withInputStream { dotEnv.load(it) }
    dotEnv.each { k, v -> ext.set(k as String, v as String) }
}

group = 'ca.bradj.questown' // http://maven.apache.org/guides/mini/guide-naming-conventions.html
archivesBaseName = 'questown'

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

repositories {
    mavenLocal()
    maven {
        // location of the maven that hosts JEI files
        name = "Progwml6 maven"
        url = "https://dvs1.progwml6.com/files/maven/"
    }
    maven { url 'https://maven.blamejared.com' }
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content { includeGroup "maven.modrinth" }
    }
}

println('Java: ' + System.getProperty('java.version') + ' JVM: ' + System.getProperty('java.vm.version') + '(' + System.getProperty('java.vendor') + ') Arch: ' + System.getProperty('os.arch'))
minecraft {
    // The mappings can be changed at any time, and must be in the following format.
    // Channel:   Version:
    // snapshot   YYYYMMDD   Snapshot are built nightly.
    // stable     #          Stables are built at the discretion of the MCP team.
    // official   MCVersion  Official field/method names from Mojang mapping files
    //
    // You must be aware of the Mojang license when using the 'official' mappings.
    // See more information here: https://github.com/MinecraftForge/MCPConfig/blob/master/Mojang.md
    //
    // Use non-default mappings at your own risk. they may not always work.
    // Simply re-run your setup task after changing the mappings to update your workspace.
    mappings channel: 'official', version: '1.20.1'
    // makeObfSourceJar = false // an Srg named sources jar is made by default. uncomment this to disable.
    
     accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            // Client owns run-client/ (server keeps run/; shared log4j files
            // wedge the client join otherwise).
            workingDirectory project.file('run-client')

            // Netty (Forge networking) reflects into jdk.internal.misc on JDK 17+.
            jvmArg '--add-opens=java.base/jdk.internal.misc=ALL-UNNAMED'
            jvmArg '--add-opens=java.base/jdk.internal.ref=ALL-UNNAMED'
            // Netty's epoll transport can stall the handshake; use the pure-Java one.
            jvmArg '-Dio.netty.transport.noNative=true'

            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'info'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"

            // Port-test hook (QtDiagClient); inert without the [qtdiag] command file.
            property 'questown.diag', 'true'
            // Dev-only: -Pautojoin makes the client skip the title screen and
            // connect straight to a local (hold-mode autotest) server.
            if (project.hasProperty('autojoin')) {
                def port = System.getProperty('questown.diag.port',
                        project.findProperty('autoport') ?: '25565')
                args '--quickPlayMultiplayer', "localhost:${port}"
            }

            mods {
                questown {
                    source sourceSets.main
                }
            }
        }

        server {
            workingDirectory project.file('run')

            // Netty's epoll transport can stall the handshake; use the pure-Java one.
            jvmArg '-Dio.netty.transport.noNative=true'

            // No Swing server GUI: it steals focus.
            args '--nogui'

            // Recommended logging data for a userdev environment
            // The markers can be changed as needed.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            property 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            property 'forge.logging.console.level', 'info'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"

            jvmArg '-Dquestown.autotest=' + System.getProperty('questown.autotest', 'false')
            jvmArg '-Dquestown.autotest.warp=' + System.getProperty('questown.autotest.warp', '24000')
            jvmArg '-Dquestown.autotest.hold=' + System.getProperty('questown.autotest.hold', 'false')
            // Forward the category/scenario filters to the forked server JVM
            // (AutoTestRunner.parseCategory).
            if (System.getProperty('QUESTOWN_AUTOTEST_CATEGORY') != null) {
                jvmArg '-DQUESTOWN_AUTOTEST_CATEGORY=' + System.getProperty('QUESTOWN_AUTOTEST_CATEGORY')
            }
            if (System.getProperty('questown.autotest.only') != null) {
                jvmArg '-Dquestown.autotest.only=' + System.getProperty('questown.autotest.only')
            }
            if (System.getProperty('questown.autotest.shard') != null) {
                jvmArg '-Dquestown.autotest.shard=' + System.getProperty('questown.autotest.shard')
            }
            // Accepted for parity with the 1.20.6 branch; 1.19.2 has no tick-rate lever, so the
            // server logs that it stays at 20 t/s (Compat.setServerTickRate).
            if (System.getProperty('questown.autotest.tickrate') != null) {
                jvmArg '-Dquestown.autotest.tickrate=' + System.getProperty('questown.autotest.tickrate')
            }
            if (System.getProperty('questown.village.agentDrive') != null) {
                jvmArg '-Dquestown.village.agentDrive=' + System.getProperty('questown.village.agentDrive')
            }
            ['days', 'coal', 'mat_coal', 'skipnight'].each { knob ->
                def v = System.getProperty('questown.village.selfsuff.' + knob)
                if (v != null) {
                    jvmArg '-Dquestown.village.selfsuff.' + knob + '=' + v
                }
            }
            if (System.getProperty('questown.log4j.config') != null) {
                jvmArg '-Dlog4j2.configurationFile=' + System.getProperty('questown.log4j.config')
            }

            mods {
                questown {
                    source sourceSets.main
                }
            }
        }

        data {
            workingDirectory project.file('run')

            // Recommended logging data for a userdev environment
            // The markers can be changed as needed.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            property 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            property 'forge.logging.console.level', 'info'

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            args '--mod', 'questown', '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')

            mods {
                questown {
                    source sourceSets.main
                }
            }
        }
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.4.0'
    testImplementation 'org.mockito:mockito-core:3.12.4'
    testImplementation 'junit:junit:4.13.1'

    minecraft 'net.minecraftforge:forge:1.20.1-47.1.3'

    implementation fg.deobf("mezz.jei:jei-1.20.1-forge:15.0.0.16")

    implementation fg.deobf("ca.bradj:roomrecipes:1.20.1-1.0.0-alpha.1")
}

test {
    useJUnitPlatform()
    testLogging.showStandardStreams=true
}

def getVersion() {
    def branch = ""
    def proc = "git rev-parse --abbrev-ref HEAD".execute()
    proc.in.eachLine { line -> branch = line }
    proc.err.eachLine { line -> println line }
    proc.waitFor()
    if (include_timestamp == true) {
        branch = "${branch + new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")}"
    }
    return branch
}

version = getVersion();

// Example for how to get properties into the manifest for reading by the runtime..
jar {
    manifest {
        attributes([
            "Specification-Title": "questown",
            "Specification-Vendor": "questown",
            "Specification-Version": "1", // We are version 1 of ourselves
            "Implementation-Title": project.name,
            "Implementation-Version": "${getVersion()}",
            "Implementation-Vendor" :"ca.bradj",
            "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

publish {
    manifest {
        attributes([
            "Specification-Title": "questown",
            "Specification-Vendor": "questown",
            "Specification-Version": "1", // We are version 1 of ourselves
            "Implementation-Title": project.name,
            "Implementation-Version": "${version}",
            "Implementation-Vendor" :"questown",
            "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

// Example configuration to allow publishing using the maven-publish task
// This is the preferred method to reobfuscate your jar file
jar.finalizedBy('reobfJar')
publish.finalizedBy('reobfJar')
// However if you are in a multi-project build, dev time needs unobfed jar files, so you can delay the obfuscation until publishing by doing

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file:///${project.projectDir}/mcmodsrepo"
        }
    }
}

publish.dependsOn('publishModrinth')

task publishModrinth(dependsOn: 'reobfJar') {
    group = 'publishing'
    mustRunAfter('publishToMavenLocal', 'publishMavenJavaPublicationToMavenRepository')
    doLast {
        def token = project.findProperty("MODRINTH_TOKEN") ?: System.getenv("MODRINTH_TOKEN") ?: ""
        if (token.isBlank()) {
            throw new GradleException("MODRINTH_TOKEN is empty. Put it in .env at the root of the main checkout.")
        }
        def changelog = (project.findProperty("CHANGELOG") ?: System.getenv("CHANGELOG") ?: "").replace('"', '\\"').replace('\n', '\\n')
        def jarPath = jar.archivePath.absolutePath
        def cleanVersion = "git rev-parse --abbrev-ref HEAD".execute().text.trim()
        def versionType = cleanVersion.contains("alpha") ? "alpha" : cleanVersion.contains("beta") ? "beta" : "release"
        def projectId = project.findProperty("MODRINTH_PROJECT_ID") ?: System.getenv("MODRINTH_PROJECT_ID") ?: "QY0XuBVZ"
        def data = """{"name":"Questown ${cleanVersion}","version_number":"${cleanVersion}","version_type":"${versionType}","featured":false,"game_versions":["1.20.1"],"loaders":["forge"],"project_id":"${projectId}","changelog":"${changelog}","dependencies":[{"project_id":"mvnAaWca","dependency_type":"required"}],"file_parts":["file"],"primary_file":"file"}"""
        exec {
            commandLine 'curl', '--fail-with-body', '-s', '-X', 'POST',
                    'https://api.modrinth.com/v2/version',
                    '-H', "Authorization: ${token}",
                    '-F', "data=${data}",
                    '-F', "file=@${jarPath}"
        }
    }
}

// Dev console via FIFO: feeds the server's stdin from run/server-cmd.fifo so
// console commands can be driven headlessly. Gated ONLY on -Dquestown.tp.fifo
// (independent of autotest, so plain dev servers get a console too).
if (System.getProperty('questown.tp.fifo') != null) {
    tasks.matching { it.name == 'runServer' }.configureEach {
        standardInput = new java.io.FileInputStream(project.file('run/server-cmd.fifo'))
    }
}

// Autotest suites start from a clean world: residue from prior runs makes results run-count
// dependent.
if (System.getProperty('questown.autotest', 'false') == 'true') {
    tasks.matching { it.name == 'runServer' }.configureEach {
        doFirst {
            def world = project.file('run/world')
            if (world.exists()) {
                println '[autotest] wiping run/world for a clean suite run'
                world.deleteDir()
            }
        }
    }
}

// importCheck: the unused-import gate (import-clean, JavaParser AST). Skipped where the tool
// is not installed.
task importCheck {
    group = 'verification'
    description = 'Fail if any Java source has unused imports.'
    doLast {
        def cleaner = '/home/retro/.local/bin/import-clean'
        if (!new File(cleaner).canExecute()) {
            logger.warn("importCheck: ${cleaner} not found; skipping the unused-import check")
            return
        }
        def proc = new ProcessBuilder(cleaner, 'check', 'src/main/java', 'src/test/java')
                .redirectErrorStream(true).start()
        def output = proc.inputStream.text
        proc.waitFor()
        if (proc.exitValue() != 0) {
            logger.lifecycle(output)
            throw new GradleException("importCheck: unused imports found. Fix: ${cleaner} apply src/main/java src/test/java")
        }
    }
}
check.dependsOn importCheck


tasks.withType(JavaCompile).configureEach { options.compilerArgs << '-Xmaxerrs' << '10000' }
