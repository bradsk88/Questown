plugins {
    id 'java-library'
    id 'eclipse'
    id 'maven-publish'
    id 'net.neoforged.gradle.userdev' version '7.1.39'
}

group = 'ca.bradj.questown' // http://maven.apache.org/guides/mini/guide-naming-conventions.html
archivesBaseName = 'questown'

// Minecraft 1.20.6 requires Java 21 (Mojang ships Java 21 to end users).
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

// Load .env file if present (gitignored — store secrets like MODRINTH_TOKEN here)
def dotEnv = new Properties()
def dotEnvFile = file('.env')
if (dotEnvFile.exists()) {
    dotEnvFile.withInputStream { dotEnv.load(it) }
    dotEnv.each { k, v -> ext.set(k as String, v as String) }
}

repositories {
    mavenLocal()
    maven { url = 'https://maven.neoforged.net/releases' }
    maven {
        name = "Progwml6 maven"
        url = "https://dvs1.progwml6.com/files/maven/"
    }
    maven { url 'https://maven.blamejared.com' }
    mavenCentral()
}

println('Java: ' + System.getProperty('java.version') + ' JVM: ' + System.getProperty('java.vm.version') + '(' + System.getProperty('java.vendor') + ') Arch: ' + System.getProperty('os.arch'))

accessTransformers {
    file 'src/main/resources/META-INF/accesstransformer.cfg'
}

runs {
    configureEach {
        // Server keeps run/; the client gets run-client/ so the two JVMs never share
        // the same log4j appender files (that contention wedged a client join).
        workingDirectory (it.name == 'client' ? project.file('run-client') : project.file('run'))
        modSource project.sourceSets.main
            // Force Netty onto the pure-Java NIO transport. The epoll native transport
            // silently stalls in this sandbox: server accepts connections but its event
            // loop never delivers reads (idle in epollWait), so handshakes die with the
            // client stuck on the "Connecting" screen.
            jvmArgument '-Dio.netty.transport.noNative=true'
            // JDK 21 modules: netty (used by NeoForge networking) reflectively touches
            // jdk.internal.misc.Unsafe. --add-opens keeps the client booting on JDK 21.
            jvmArgument '--add-opens=java.base/jdk.internal.misc=ALL-UNNAMED'
            jvmArgument '--add-opens=java.base/jdk.internal.ref=ALL-UNNAMED'
            systemProperty 'neoForge.logging.markers', 'REGISTRIES'
            systemProperty 'neoForge.logging.console.level', 'info'
            // Port-test hook (QtDiagClient): inert unless the server whispers the
            // [qtdiag] chat tokens; see tools/porttest/PORTTEST.md.
            systemProperty 'questown.diag', 'true'
        }

        client {
            // Port-test canvas: pin the window size so pixel diffs between MC
            // versions are on an identical grid.
            arguments '--width', '1280', '--height', '720'
            // Dev-only: -Pautojoin makes the client skip the title screen and
            // connect straight to a local (hold-mode autotest) server.
            // (Vanilla 1.20.6 dropped the old --server/--port client args;
            // --quickPlayMultiplayer is the supported form.)
            if (project.hasProperty('autojoin')) {
                arguments '--quickPlayMultiplayer', 'localhost:25565'
            }
        }

        server {
            // Keep the Swing server GUI out of the dev box: it steals focus and
            // screen space, and headless screenshots (grim) can't see past it.
            argument '--nogui'
            systemProperty 'neoForge.logging.console.level', 'info'

            jvmArgument '-Dquestown.autotest=' + System.getProperty('questown.autotest', 'false')
            jvmArgument '-Dquestown.autotest.warp=' + System.getProperty('questown.autotest.warp', '24000')
            jvmArgument '-Dquestown.autotest.hold=' + System.getProperty('questown.autotest.hold', 'false')
            // Forward the category/scenario filters to the forked server JVM so the
            // runbook's documented -D invocations reach AutoTestRunner.parseCategory.
            if (System.getProperty('QUESTOWN_AUTOTEST_CATEGORY') != null) {
                jvmArgument '-DQUESTOWN_AUTOTEST_CATEGORY=' + System.getProperty('QUESTOWN_AUTOTEST_CATEGORY')
            }
            if (System.getProperty('questown.autotest.only') != null) {
                jvmArgument '-Dquestown.autotest.only=' + System.getProperty('questown.autotest.only')
            }
            if (System.getProperty('questown.village.agentDrive') != null) {
                jvmArgument '-Dquestown.village.agentDrive=' + System.getProperty('questown.village.agentDrive')
            }
        }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.4.0'
    testImplementation 'org.mockito:mockito-core:3.12.4'
    testImplementation 'junit:junit:4.13.1'

    // NeoForge — the userdev plugin detects this and builds the dev runtime from it.
    implementation 'net.neoforged:neoforge:20.6.141'

    implementation 'mezz.jei:jei-1.20.6-neoforge:18.0.0.66'

    implementation 'ca.bradj:roomrecipes:1.20.6-neoforge'
    // NOTE: Patchouli (journal) is intentionally NOT on the NeoForge 1.20.6 classpath —
    // it has no Forge build past 1.20.1. The journal GUI is dropped for this release and
    // scheduled to return as a neutral-screen rework. See
    // .scratch/bring-back-journal/bring-back-journal.md (status: needs-triage).
}

test {
    useJUnitPlatform()
    testLogging.showStandardStreams=true
}

def getVersion() {
    def branch = ""
    def proc = "git rev-parse --abbrev-ref HEAD".execute()
    proc.in.eachLine { line -> branch = line }
    proc.err.eachLine { line -> println line }
    proc.waitFor()
    if (include_timestamp == true) {
        branch = "${branch + new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")}"
    }
    return branch
}

version = getVersion();

jar {
    manifest {
        attributes([
            "Specification-Title": "questown",
            "Specification-Vendor": "questown",
            "Specification-Version": "1",
            "Implementation-Title": project.name,
            "Implementation-Version": "${getVersion()}",
            "Implementation-Vendor" :"ca.bradj",
            "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

publish {
    manifest {
        attributes([
            "Specification-Title": "questown",
            "Specification-Vendor": "questown",
            "Specification-Version": "1",
            "Implementation-Title": project.name,
            "Implementation-Version": "${version}",
            "Implementation-Vendor" :"ca.bradj",
            "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

publish.dependsOn('reobfJar')

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file:///${project.projectDir}/mcmodsrepo"
        }
    }
}

publish.dependsOn('publishModrinth')

task publishModrinth(dependsOn: 'reobfJar') {
    group = 'publishing'
    mustRunAfter('publishToMavenLocal', 'publishMavenJavaPublicationToMavenRepository')
    doLast {
        def token = project.findProperty("MODRINTH_TOKEN") ?: System.getenv("MODRINTH_TOKEN") ?: ""
        def changelog = (project.findProperty("CHANGELOG") ?: System.getenv("CHANGELOG") ?: "").replace('"', '\\"').replace('\n', '\\n')
        def jarPath = jar.archivePath.absolutePath
        def cleanVersion = "git rev-parse --abbrev-ref HEAD".execute().text.trim()
        def versionType = cleanVersion.contains("alpha") ? "alpha" : cleanVersion.contains("beta") ? "beta" : "release"
        def projectId = project.findProperty("MODRINTH_PROJECT_ID") ?: System.getenv("MODRINTH_PROJECT_ID") ?: "QY0XuBVZ"
        def data = """{"name":"Questown ${cleanVersion}","version_number":"${cleanVersion}","version_type":"${versionType}","featured":false,"game_versions":["1.20.6"],"loaders":["neoforge"],"project_id":"${projectId}","changelog":"${changelog}","dependencies":[],"file_parts":["file"],"primary_file":"file"}"""
        // curl truncates an inline -F "data=${data}" field at ~270 chars, 400ing a long
        // changelog with "EOF while parsing a string at column 270" (the version string
        // alone pushes the skeleton past 270). Send the data from a file instead.
        def dataFile = new File(buildDir, 'modrinth-data.json')
        dataFile.text = data
        exec {
            commandLine 'curl', '--fail', '-s', '-X', 'POST',
                    'https://api.modrinth.com/v2/version',
                    '-H', "Authorization: ${token}",
                    '-F', "data=@${dataFile}",
                    '-F', "file=@${jarPath}"
        }
    }
}

// Autotest suites start from a clean world: residue from prior suite runs
// accumulates in run/world and makes results run-count dependent
// (.scratch/autotest-suite/organizer-fetch-warp-fails-only-in-full-suite.md).
// Dev console via FIFO: feeds the server's stdin from run/server-cmd.fifo so
// console commands can be driven headlessly. Gated ONLY on -Dquestown.tp.fifo
// (independent of autotest, so plain dev servers get a console too).
if (System.getProperty('questown.tp.fifo') != null) {
    tasks.matching { it.name == 'runServer' }.configureEach {
        standardInput = new java.io.FileInputStream(project.file('run/server-cmd.fifo'))
    }
}

if (System.getProperty('questown.autotest', 'false') == 'true') {
    tasks.matching { it.name == 'runServer' }.configureEach {
        doFirst {
            def world = project.file('run/world')
            if (world.exists()) {
                println '[autotest] wiping run/world for a clean suite run'
                world.deleteDir()
            }
        }
    }
}

// importCheck: deterministic, surgical unused-import gate. Delegates to the
// import-clean tool (JavaParser AST): it removes only imports whose name appears
// nowhere as a real identifier in the parsed tree and never reformats the body,
// so it can never drop a used import. Wired into `check` so `./gradlew build`/
// `check` surfaces it, and runnable standalone as `./gradlew importCheck`.
// Fix a failure with:  /home/retro/.local/bin/import-clean apply src/main/java src/test/java
task importCheck {
    group = 'verification'
    description = 'Fail if any Java source has unused imports. Fix: import-clean apply src/main/java src/test/java'
    doLast {
        def cleaner = '/home/retro/.local/bin/import-clean'
        def proc = new ProcessBuilder(cleaner, 'check', 'src/main/java', 'src/test/java')
                .redirectErrorStream(true).start()
        def output = proc.inputStream.text
        proc.waitFor()
        if (proc.exitValue() != 0) {
            logger.lifecycle(output)
            throw new GradleException("importCheck: unused imports found. Fix: ${cleaner} apply src/main/java src/test/java")
        }
    }
}
check.dependsOn importCheck

// stranglerCheck: version-API gate (see tools/strangler-check). Fails when a
// file outside the seam family (mc/, gui/RenderUtil, gui/RenderContext,
// loader/, core/network/) touches a 1.20+-only API and is not in the
// grandfather list. The grandfather list (tools/strangler-grandfather.txt,
// 124 files from the 1.19.2 probe report) is expected to shrink to zero as
// clusters are routed through seams.
task stranglerCheck {
    group = 'verification'
    description = 'Fail if a non-seam, non-grandfathered file uses a version-specific (1.20+) MC API. Fix: route through a seam, or add the path to tools/strangler-grandfather.txt if tracked in the probe report.'
    doLast {
        def proc = new ProcessBuilder(project.file('tools/strangler-check').absolutePath).redirectErrorStream(true).start()
        def output = proc.inputStream.text
        def code = proc.waitFor()
        if (code != 0) {
            logger.lifecycle(output)
            throw new GradleException("stranglerCheck: version-specific API outside the seam (see output)")
        }
    }
}
check.dependsOn stranglerCheck
